version: 2
updates:
  # Root module only. testdata/vulnerable-payment-service is the golden
  # regression fixture — its dependencies are pinned to specific versions
  # so EXPECTED-FINDINGS.md line numbers stay stable. Dependabot must not
  # touch the fixture.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
