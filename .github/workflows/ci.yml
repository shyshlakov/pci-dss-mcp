name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-macos:
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"

      - name: Verify modules
        run: go mod download && go mod verify

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        env:
          GOFLAGS: -p=2
        run: make test TEST_TIMEOUT=25m

      - name: Test fixture (golden regression)
        run: make test-fixture

  test-ubuntu:
    name: test (ubuntu-latest, ${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: heavy-taint
            packages: "./internal/taint/... ./internal/taint_ssa/..."
          - name: scanner-heavy
            packages: "./scanner/panscanner/... ./scanner/hybrid/... ./scanner/reportscanner/... ./scanner/triagescanner/..."
          - name: rest
            packages: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"

      - name: Verify modules
        run: go mod download && go mod verify

      - name: Vet
        if: matrix.group.name == 'rest'
        run: make vet

      - name: Build
        if: matrix.group.name == 'rest'
        run: make build

      - name: Compute rest package list
        if: matrix.group.name == 'rest'
        run: |
          rest=$(go list ./... | grep -v -E '^github.com/shyshlakov/pci-dss-mcp/internal/taint(_ssa)?(/|$)' | grep -v -E '^github.com/shyshlakov/pci-dss-mcp/scanner/(panscanner|hybrid|reportscanner|triagescanner)(/|$)' | tr '\n' ' ')
          echo "REST_PKGS=$rest" >> "$GITHUB_ENV"

      - name: Test (heavy-taint)
        if: matrix.group.name == 'heavy-taint'
        run: go test ${{ matrix.group.packages }} -count=1 -race -timeout=15m

      - name: Test (scanner-heavy)
        if: matrix.group.name == 'scanner-heavy'
        run: go test ${{ matrix.group.packages }} -count=1 -race -timeout=15m

      - name: Test (rest)
        if: matrix.group.name == 'rest'
        env:
          GOFLAGS: -p=2
        run: go test $REST_PKGS -count=1 -race -timeout=15m

      - name: docs-check (advisory)
        if: matrix.group.name == 'rest'
        run: make docs-check || true

      - name: Test fixture (golden regression)
        if: matrix.group.name == 'rest'
        run: make test-fixture

      - name: SBOM standards validation (CycloneDX 1.6)
        if: matrix.group.name == 'rest'
        run: make test-sbom-validate

  coverage:
    name: coverage (${{ matrix.group.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - name: heavy-taint
            packages: "./internal/taint/... ./internal/taint_ssa/..."
          - name: scanner-heavy
            packages: "./scanner/panscanner/... ./scanner/hybrid/... ./scanner/reportscanner/... ./scanner/triagescanner/..."
          - name: rest
            packages: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"

      - name: Verify modules
        run: go mod download && go mod verify

      - name: Compute rest package list
        if: matrix.group.name == 'rest'
        run: |
          rest=$(go list ./... | grep -v -E '^github.com/shyshlakov/pci-dss-mcp/internal/taint(_ssa)?(/|$)' | grep -v -E '^github.com/shyshlakov/pci-dss-mcp/scanner/(panscanner|hybrid|reportscanner|triagescanner)(/|$)' | tr '\n' ' ')
          echo "REST_PKGS=$rest" >> "$GITHUB_ENV"

      - name: Run tests with coverage (heavy-taint)
        if: matrix.group.name == 'heavy-taint'
        run: go test ${{ matrix.group.packages }} -race -coverprofile=coverage.out -covermode=atomic

      - name: Run tests with coverage (scanner-heavy)
        if: matrix.group.name == 'scanner-heavy'
        run: go test ${{ matrix.group.packages }} -race -coverprofile=coverage.out -covermode=atomic

      - name: Run tests with coverage (rest)
        if: matrix.group.name == 'rest'
        env:
          GOFLAGS: -p=2
        run: go test $REST_PKGS -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.out
          flags: ${{ matrix.group.name }}
          name: coverage-${{ matrix.group.name }}
          fail_ci_if_error: false

  fuzz-smoke:
    name: fuzz-smoke (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: FuzzLuhn
            pkg: ./scanner/panscanner/...
          - name: FuzzWalker
            pkg: ./scanner
          - name: FuzzCursorDecode
            pkg: ./scanner/reportscanner/...
          - name: FuzzScriptScannerHTML
            pkg: ./scanner/scriptscanner/...
          - name: FuzzGoModSBOM
            pkg: ./scanner/sbomscanner/...
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"

      - name: Verify modules
        run: go mod download && go mod verify

      - name: Replay committed fuzz seeds (deterministic)
        run: go test -run=^Fuzz -count=1 ${{ matrix.target.pkg }}

      - name: Fuzz smoke (30s)
        run: go test -run=^$ -fuzz=${{ matrix.target.name }} -fuzztime=30s ${{ matrix.target.pkg }}

      - name: Fail on new crash seeds
        if: always()
        run: |
          new=$(git status --porcelain testdata/fuzz/ 2>/dev/null || true)
          if [ -n "$new" ]; then
            echo "::error::new fuzz crash seeds appeared under testdata/fuzz/:"
            echo "$new"
            git --no-pager diff --stat testdata/fuzz/ || true
            exit 1
          fi
