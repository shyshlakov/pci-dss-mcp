name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.9"

      - name: Verify modules
        run: go mod download && go mod verify

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test fixture (golden regression)
        run: make test-fixture

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.9"

      - name: Run tests with coverage
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  fuzz-smoke:
    name: fuzz-smoke (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: FuzzLuhn
            pkg: ./scanner/panscanner/...
          - name: FuzzWalker
            pkg: ./scanner/...
          - name: FuzzCursorDecode
            pkg: ./scanner/reportscanner/...
          - name: FuzzScriptScannerHTML
            pkg: ./scanner/scriptscanner/...
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.9"

      - name: Verify modules
        run: go mod download && go mod verify

      - name: Replay committed fuzz seeds (deterministic)
        run: go test -run=^Fuzz -count=1 ${{ matrix.target.pkg }}

      - name: Fuzz smoke (30s)
        run: go test -run=^$ -fuzz=${{ matrix.target.name }} -fuzztime=30s ${{ matrix.target.pkg }}

      - name: Fail on new crash seeds
        if: always()
        run: |
          new=$(git status --porcelain testdata/fuzz/ 2>/dev/null || true)
          if [ -n "$new" ]; then
            echo "::error::new fuzz crash seeds appeared under testdata/fuzz/:"
            echo "$new"
            git --no-pager diff --stat testdata/fuzz/ || true
            exit 1
          fi
