name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          languages: go
          queries: security-and-quality

      # Explicit build — analyzes the root module only. testdata/vulnerable-
      # payment-service is a nested Go module with its own go.mod, so
      # `go build ./...` from the root naturally excludes it. CodeQL only
      # scans what the build actually compiles, so the fixture stays out of
      # results without needing paths-ignore (which doesn't work for
      # compiled languages in CodeQL).
      - name: Build root module
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          category: "/language:go"
