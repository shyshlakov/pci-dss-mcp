name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3
        with:
          languages: go
          queries: security-and-quality

      # Explicit build — analyzes the root module only. testdata/vulnerable-
      # payment-service is a nested Go module with its own go.mod, so
      # `go build ./...` from the root naturally excludes it. CodeQL only
      # scans what the build actually compiles, so the fixture stays out of
      # results without needing paths-ignore (which doesn't work for
      # compiled languages in CodeQL).
      - name: Build root module
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v3
        with:
          category: "/language:go"
