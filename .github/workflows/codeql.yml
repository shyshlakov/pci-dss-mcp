name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    # CodeQL SARIF upload requires code scanning enabled, which on private
    # repos needs GitHub Advanced Security (paid). Skip on private so the
    # workflow stays green during pre-release verification; it activates
    # automatically once the repo is flipped to public.
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.9"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
        with:
          languages: go
          queries: security-and-quality

      # Explicit build — analyzes the root module only. testdata/vulnerable-
      # payment-service is a nested Go module with its own go.mod, so
      # `go build ./...` from the root naturally excludes it. CodeQL only
      # scans what the build actually compiles, so the fixture stays out of
      # results without needing paths-ignore (which doesn't work for
      # compiled languages in CodeQL).
      - name: Build root module
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3
        with:
          category: "/language:go"
