name: Release Docker image and publish to MCP Registry

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Validate server.json against MCP schema
        run: make validate-server-json

      - name: Sync server.json version from git tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].identifier = "ghcr.io/shyshlakov/pci-dss-mcp:v" + $v' \
            server.json > server.tmp
          mv server.tmp server.json
          jq . server.json

      # Two-tier action pinning: SHA-pin for actions/checkout + sigstore; major-version-pin for Docker-official (Scorecard-accepted per RESEARCH.md Finding 4).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker metadata (tags + annotations)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/shyshlakov/pci-dss-mcp
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
          annotations: |
            io.modelcontextprotocol.server.name=io.github.shyshlakov/pci-dss-mcp
            org.opencontainers.image.source=https://github.com/shyshlakov/pci-dss-mcp
            org.opencontainers.image.description=Narrow-and-deep PCI DSS v4.0.1 compliance scanner for Go payment services, delivered as an MCP server

      - name: Build local smoke image (single platform, loaded into daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: pci-dss-mcp:smoke

      - name: Run Docker smoke test (severity parity gate)
        run: make docker-smoke IMAGE=pci-dss-mcp:smoke

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Sign image by digest (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/shyshlakov/pci-dss-mcp
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -sSLf "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Authenticate to MCP Registry (github-oidc, zero secrets)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
