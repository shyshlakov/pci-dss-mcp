name: Fuzz weekly

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz-weekly (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: FuzzLuhn
            pkg: ./scanner/panscanner/...
          - name: FuzzWalker
            pkg: ./scanner
          - name: FuzzCursorDecode
            pkg: ./scanner/reportscanner/...
          - name: FuzzScriptScannerHTML
            pkg: ./scanner/scriptscanner/...
          - name: FuzzGoModSBOM
            pkg: ./scanner/sbomscanner/...
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"

      - name: Compute ISO week cache key
        id: cachekey
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore fuzz cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-${{ matrix.target.name }}-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            fuzz-${{ matrix.target.name }}-

      - name: Fuzz (30m)
        id: fuzz
        run: go test -run=^$ -fuzz=${{ matrix.target.name }} -fuzztime=30m ${{ matrix.target.pkg }}

      - name: Detect new crash seeds
        if: failure()
        id: crash
        run: |
          new=$(git status --porcelain testdata/fuzz/${{ matrix.target.name }}/ 2>/dev/null | awk '{print $2}' || true)
          {
            echo "files<<CRASH_EOF"
            echo "$new"
            echo "CRASH_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$new" ]; then
            {
              echo "body<<CRASH_EOF"
              for f in $new; do
                echo "### $f"
                echo ""
                echo '```'
                head -c 4096 "$f" 2>/dev/null || true
                echo '```'
                echo ""
              done
              echo "CRASH_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload crash seeds as artifact
        if: failure() && steps.crash.outputs.files != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target.name }}-${{ github.run_id }}
          path: testdata/fuzz/${{ matrix.target.name }}/
          retention-days: 30

      - name: Open GitHub issue on new crash
        if: failure() && steps.crash.outputs.files != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const target = '${{ matrix.target.name }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Weekly fuzz run discovered a new crash in \`${target}\`.`,
              ``,
              `Run: ${runUrl}`,
              ``,
              `Reproducer seed bytes (first 4096 bytes each):`,
              ``,
              `${{ steps.crash.outputs.body }}`,
              ``,
              `Reproduce locally:`,
              ``,
              '```',
              `go test -run=^${target}$ ./... -count=1`,
              '```',
              ``
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `fuzz: new crash in ${target}`,
              body: body,
              labels: ['fuzz', 'bug']
            });
